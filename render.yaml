services:
  - type: web
    name: ams-convention
    runtime: node
    region: frankfurt
    plan: free

    # Build: install, build Next.js, then copy assets into standalone folder
    buildCommand: |
      npm ci &&
      npm run build &&
      cp -r public .next/standalone/public &&
      cp -r .next/static .next/standalone/.next/static &&
      mkdir -p .next/standalone/data &&
      (test -f .next/standalone/data/registrations.json || echo "[]" > .next/standalone/data/registrations.json) &&
      (test -f .next/standalone/data/settings.json || echo '{"youtubeStreamId":""}' > .next/standalone/data/settings.json)

    # Render injects PORT automatically — standalone Next.js server respects it
    startCommand: node .next/standalone/server.js

    autoDeploy: true
    branch: master

    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false   # Set this in Render dashboard → Environment
