services:
  - type: web
    name: ams-convention
    runtime: node
    region: frankfurt
    plan: free

    buildCommand: NODE_OPTIONS=--max-old-space-size=400 npm ci && NODE_OPTIONS=--max-old-space-size=400 npm run build

    # next start respects PORT env var set by Render automatically
    startCommand: npm start

    autoDeploy: true
    branch: master

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard — your Neon connection string
      - key: ADMIN_PASSWORD
        sync: false   # Set in Render dashboard
