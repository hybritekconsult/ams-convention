services:
  - type: web
    name: ams-convention
    runtime: node
    region: frankfurt
    plan: free

    buildCommand: |
      npm ci &&
      npm run build &&
      mkdir -p data &&
      (test -f data/registrations.json || echo "[]" > data/registrations.json) &&
      (test -f data/settings.json || echo '{"youtubeStreamId":""}' > data/settings.json)

    # next start respects PORT env var set by Render automatically
    startCommand: npm start

    autoDeploy: true
    branch: master

    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false   # Set in Render dashboard → your service → Environment
