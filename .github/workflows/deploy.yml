name: Deploy to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Next.js (standalone output) ──────────────────────
      - name: Build
        run: npm run build
        env:
          # Provide dummy values so the build succeeds without real secrets.
          # Real values live in .env on the server — never stored here.
          YOUTUBE_STREAM_ID: ""
          ADMIN_PASSWORD: "build-only"

      # ── 5. Package standalone build for upload ────────────────────
      # next build --output standalone produces .next/standalone which
      # is a self-contained Node.js server (server.js + node_modules).
      # We copy public/ and .next/static/ into it as required by Next docs.
      - name: Prepare deployment package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          # Include data directory (JSON storage) — create if missing
          mkdir -p .next/standalone/data
          echo "[]" > .next/standalone/data/registrations.json
          # Create a start script for cPanel Node.js app
          cat > .next/standalone/start.sh << 'EOF'
          #!/bin/bash
          export NODE_ENV=production
          export PORT=${PORT:-3000}
          exec node server.js
          EOF
          chmod +x .next/standalone/start.sh

      # ── 6. Deploy via FTP to cPanel ───────────────────────────────
      # Uses FTP-Deploy-Action to sync .next/standalone/ to the remote path.
      # Credentials stored as GitHub Secrets — never hardcoded.
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: .next/standalone/
          server-dir: /public_html/adorersnetherlands/
          # Don't delete data/registrations.json on the server
          exclude: |
            **/.git*
            **/.git*/**
            data/registrations.json
          dangerous-clean-slate: false

      # ── 7. Restart Node.js app via cPanel API ─────────────────────
      # Calls the cPanel UAPI to restart the Node.js application.
      # The app must be created manually once in cPanel's "Setup Node.js App":
      #   - App root: public_html/adorersnetherlands
      #   - Startup file: server.js
      #   - Node.js version: 20
      - name: Restart Node.js app on cPanel
        run: |
          curl -s -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/NodeJS/restart_app" \
            -d "app_name=adorersnetherlands" \
            || echo "Restart call finished (check cPanel if app did not restart)"
